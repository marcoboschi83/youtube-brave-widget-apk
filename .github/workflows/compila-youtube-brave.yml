name: YouTube Brave - Crea APK

on:
  push:
    paths:
      - '.github/workflows/compila-youtube-brave.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
