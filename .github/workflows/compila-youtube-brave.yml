      - name: Compila APK debug installabile
        run: gradle --no-daemon --project-dir /tmp/youtube-brave/YouTubeSearchBrave :app:assembleDebug

      - name: Verifica e prepara APK
        shell: bash
        run: |
          test -s /tmp/youtube-brave/YouTubeSearchBrave/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk
          cp /tmp/youtube-brave/YouTubeSearchBrave/app/build/outputs/apk/debug/app-debug.apk apk/YouTubeSearchBrave.apk
          sha256sum apk/YouTubeSearchBrave.apk

      - name: Rendi scaricabile APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeSearchBrave-APK
          path: apk/YouTubeSearchBrave.apk
          if-no-files-found: error
          retention-days: 30
